[project]
name = "gbca-rag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.62",
    "fastapi>=0.141.1",
    "google-genai>=2.16.0",
    "groq>=1.6.0",
    "lxml>=6.1.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.1",
    "tiktoken>=0.13.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
